name: Release

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write
  id-token: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          package-manager-cache: false
      - run: npm install --global npm@^11.5.1
      - run: pnpm install --frozen-lockfile
      - run: pnpm test
      - run: pnpm build-storybook
      - run: pnpm test:consumer
      - name: Apply pending changesets
        id: version
        shell: bash
        run: |
          set -euo pipefail
          CHANGESET_FILE="$(find .changeset -maxdepth 1 -type f -name '*.md' ! -name 'README.md' -print -quit)"
          if [[ -z "$CHANGESET_FILE" ]]; then
            echo "versioned=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          pnpm run version
          git diff --check
          echo "versioned=true" >> "$GITHUB_OUTPUT"

      - name: Commit version
        if: steps.version.outputs.versioned == 'true'
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A .changeset package.json CHANGELOG.md
          git commit -m "chore: version @mutsuna/ui [skip ci]"
          git push origin HEAD:main

      - name: Check publish state
        id: publish-state
        shell: bash
        run: |
          set -euo pipefail
          LOCAL_VERSION="$(node -p 'require("./package.json").version')"
          PUBLISHED_VERSION="$(npm view @mutsuna/ui version)"
          SHOULD_PUBLISH="$(node scripts/resolve-publish-state.mjs "$LOCAL_VERSION" "$PUBLISHED_VERSION")"
          echo "should_publish=$SHOULD_PUBLISH" >> "$GITHUB_OUTPUT"

      - name: Publish to npm
        if: steps.publish-state.outputs.should_publish == 'true'
        run: npm publish --access public
