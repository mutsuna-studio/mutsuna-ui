name: Release

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write
  id-token: write
  pull-requests: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    environment: npm-release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          package-manager-cache: false
      - run: npm install --global npm@^11.5.1
      - run: pnpm install --frozen-lockfile
      - run: pnpm test
      - run: pnpm build-storybook
      - run: pnpm test:consumer
      - name: Apply pending changesets
        id: version
        shell: bash
        run: |
          set -euo pipefail
          CHANGESET_FILE="$(find .changeset -maxdepth 1 -type f -name '*.md' ! -name 'README.md' -print -quit)"
          if [[ -z "$CHANGESET_FILE" ]]; then
            echo "versioned=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          pnpm run version
          git diff --check
          echo "versioned=true" >> "$GITHUB_OUTPUT"

      - name: Open version pull request
        if: steps.version.outputs.versioned == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A .changeset package.json CHANGELOG.md
          git commit -m "chore: version @mutsuna/ui"
          git push --force origin HEAD:changeset-release/main
          if gh pr view changeset-release/main >/dev/null 2>&1; then
            gh pr edit changeset-release/main \
              --title "chore: version @mutsuna/ui" \
              --body "Automated version update generated from pending changesets."
          else
            gh pr create \
              --base main \
              --head changeset-release/main \
              --title "chore: version @mutsuna/ui" \
              --body "Automated version update generated from pending changesets."
          fi

      - name: Check publish state
        if: steps.version.outputs.versioned == 'false'
        id: publish-state
        shell: bash
        run: |
          set -euo pipefail
          LOCAL_VERSION="$(node -p 'require("./package.json").version')"
          PUBLISHED_VERSION="$(npm view @mutsuna/ui version)"
          SHOULD_PUBLISH="$(node scripts/resolve-publish-state.mjs "$LOCAL_VERSION" "$PUBLISHED_VERSION")"
          echo "should_publish=$SHOULD_PUBLISH" >> "$GITHUB_OUTPUT"

      - name: Publish to npm
        if: steps.publish-state.outputs.should_publish == 'true'
        run: npm publish --access public
